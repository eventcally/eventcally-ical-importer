[project]
name = "eventcally-ical-importer"
version = "0.0.0"
description = "Imports iCal feeds into EventCally (Flask + SQLAlchemy + Celery)"
requires-python = "==3.12.*"
dependencies = [
    "Authlib>=1.3.1",
    "Babel>=2.12.1",
    "celery[redis]>=5.4.0",
    "Flask>=3.0.3",
    "flask-babel>=4.0.0",
    "Flask-Migrate>=4.0.4",
    "Flask-SQLAlchemy>=3.0.3",
    "Flask-WTF>=1.2.1",
    "gunicorn>=22.0.0",
    "ics==0.7.2",
    "psycopg2-binary>=2.9.6",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "pytz>=2023.3",
    "redis>=4.5.4",
    "requests>=2.32.0",
    "SQLAlchemy>=2.0.9,<2.1",  # 2.1 defaults postgresql:// to the psycopg 3 driver
    "structlog>=26.1.0",
    "tatsu==5.15.1",  # newer versions crash the ics import on Python 3.12
]

[dependency-groups]
dev = [
    # Exact pins: black/isort/flake8 must match .pre-commit-config.yaml (lint.yml runs these from uv.lock).
    "pytest==9.2.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.17.0",
    "requests-mock==1.12.1",
    "coverage==7.17.2",
    "black==26.10.1",
    "isort==5.12.0",
    "flake8==6.1.0",
    "pre-commit==3.8.0",
    "debugpy==1.8.22",
]

[tool.uv]
# An application, not a library: `uv sync` installs the dependencies only, never the
# project itself, so no [build-system] is needed.
package = false
# Lock only for the platforms we run on (macOS dev, Linux CI/Docker).
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
